plugins {
    id 'com.android.application'
}

def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'dev.frame.launcher'
    compileSdk 34
    buildToolsVersion '34.0.0'

    defaultConfig {
        applicationId 'dev.frame.launcher'
        minSdk 28
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    signingConfigs {
        if (keystoreFile.exists()) {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Without keystore.properties the release APK is signed with the local debug key.
            signingConfig keystoreFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig false
    }

    androidResources {
        noCompress 'ttf'
    }

    lint {
        checkReleaseBuilds false
    }

    // Don't embed the Google-encrypted dependency metadata block in the APK.
    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }
}
